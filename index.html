<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c5b21">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="WORM - a cozy puzzle game. Help Wally eat every apple without trapping himself.">
<title>WORM — Get Your Wiggle On</title>
<!-- Baloo 2 is self-hosted from fonts/ (see fonts/README.md) - no
     Google Fonts request at runtime, works fully offline. -->
<link rel="preload" href="fonts/Baloo2-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="art/worm-home-art.jpg" as="image">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Loading screen: pure HTML/CSS so it animates before any script runs.
     app.js fades it out once fonts and the first frame are ready. -->
<div id="splash" aria-hidden="true">
  <div class="splash-scene">
    <svg class="splash-dig" viewBox="0 0 240 110">
      <g class="splash-worm">
        <path d="M40 78 C40 36, 88 36, 88 78" fill="none" stroke="#c94f7c" stroke-width="22" stroke-linecap="round"/>
        <path d="M40 78 C40 36, 88 36, 88 78" fill="none" stroke="#ff9eb4" stroke-width="15" stroke-linecap="round"/>
        <circle cx="96" cy="60" r="15" fill="#ff8fab" stroke="#c94f7c" stroke-width="3"/>
        <circle cx="93" cy="55" r="4.6" fill="#fff"/><circle cx="103" cy="55" r="4.6" fill="#fff"/>
        <circle cx="94.6" cy="55.6" r="2.3" fill="#26221f"/><circle cx="104.6" cy="55.6" r="2.3" fill="#26221f"/>
        <path d="M95 64 q4 4 8 0" fill="none" stroke="#a34a68" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <rect x="0" y="78" width="240" height="32" fill="#6b4423"/>
      <path d="M0 78 Q30 72 60 78 T120 78 T180 78 T240 78 V84 H0z" fill="#8a5a2b"/>
      <g class="splash-clods"><circle cx="60" cy="74" r="3.5" fill="#8a5a2b"/><circle cx="70" cy="70" r="2.5" fill="#8a5a2b"/><circle cx="52" cy="71" r="2" fill="#8a5a2b"/></g>
    </svg>
    <div class="splash-text">Wally is digging<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
  </div>
</div>

<div id="app">

  <!-- Inline icon set - no emoji, no icon font dependency -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-restart" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19 5v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-undo" viewBox="0 0 24 24"><path d="M9 7H14.5a5.5 5.5 0 0 1 0 11H8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M11.5 3.5L7.5 7l4 3.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.6" fill="currentColor"/></symbol>
      <symbol id="ic-gear" viewBox="0 0 24 24"><path d="M12 2.5l1.6 2.3 2.7-.7.6 2.7 2.7.6-.7 2.7 2.3 1.6-2.3 1.6.7 2.7-2.7.6-.6 2.7-2.7-.7L12 21.5l-1.6-2.3-2.7.7-.6-2.7-2.7-.6.7-2.7L2.5 12l2.3-1.6-.7-2.7 2.7-.6.6-2.7 2.7.7zM15.4 12a3.4 3.4 0 1 0-6.8 0 3.4 3.4 0 0 0 6.8 0z" fill="currentColor" fill-rule="evenodd"/></symbol>
      <symbol id="ic-hat" viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="11" rx="1.5" fill="currentColor"/><rect x="7" y="11" width="10" height="2.4" fill="#ff8fab"/><ellipse cx="12" cy="16.5" rx="9" ry="2.6" fill="currentColor"/></symbol>
      <symbol id="ic-sound-on" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor"/><path d="M16.5 9a5 5 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M19 6.5a9 9 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="ic-music" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><circle cx="6.8" cy="17.6" r="2.8" fill="currentColor"/><circle cx="16.8" cy="15.6" r="2.8" fill="currentColor"/></symbol>
      <symbol id="ic-haptic" viewBox="0 0 24 24"><rect x="8" y="3.5" width="8" height="17" rx="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4.5 8.5v7M19.5 8.5v7M2 10.5v3M22 10.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="ic-motion" viewBox="0 0 24 24"><path d="M4 8c3-3 5 3 8 0s5 3 8 0M4 16c3-3 5 3 8 0s5 3 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="ic-lock" viewBox="0 0 24 24"><rect x="5.5" y="11" width="13" height="9" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.87l-5.5 2.88 1.05-6.12L3.1 9.3l6.15-.9z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="ic-apple" viewBox="0 0 24 24"><path d="M12 8.2c-1.6-1.3-5.9-1.6-6.9 2.6-.9 3.9 1.6 8.9 4.4 9.1 1 .1 1.6-.5 2.5-.5s1.5.6 2.5.5c2.8-.2 5.3-5.2 4.4-9.1-1-4.2-5.3-3.9-6.9-2.6z" fill="#ef3b2d"/><path d="M12 8.4c0-2 .6-3.6 1.8-4.6" fill="none" stroke="#7a4a21" stroke-width="1.8" stroke-linecap="round"/><path d="M13.4 5.6c1.4-1.9 3.6-2 4.6-1.5-.6 1.6-2.6 2.6-4.6 1.5z" fill="#6cc04a"/><ellipse cx="8.9" cy="11.4" rx="1.1" ry="1.7" fill="#fff" opacity=".6" transform="rotate(-20 8.9 11.4)"/></symbol>
      <!-- world emblems for the level map -->
      <symbol id="ic-w-garden" viewBox="0 0 24 24"><path d="M12 21v-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M12 13c-5 0-7-3-7-7 4 0 7 2 7 7zM12 11c0-4 2.5-7 7-7 0 4-2.5 7-7 7z" fill="currentColor"/></symbol>
      <symbol id="ic-w-riverbank" viewBox="0 0 24 24"><path d="M12 3c3.5 4.5 6 7.8 6 11a6 6 0 0 1-12 0c0-3.2 2.5-6.5 6-11z" fill="currentColor"/></symbol>
      <symbol id="ic-w-orchard" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="6.5" fill="currentColor"/><rect x="10.8" y="14" width="2.4" height="7" rx="1" fill="currentColor"/></symbol>
      <symbol id="ic-w-frost" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="ic-w-tunnels" viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z" fill="currentColor"/><path d="M3 9h18M9 4l3 16 3-16" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.4"/></symbol>
      <symbol id="ic-w-nightshade" viewBox="0 0 24 24"><path d="M15.5 3.5A8.5 8.5 0 1 0 20.5 16 7 7 0 0 1 15.5 3.5z" fill="currentColor"/></symbol>
      <symbol id="ic-w-summit" viewBox="0 0 24 24"><path d="M2 20 9.5 7l3.5 6 2.5-4L22 20z" fill="currentColor"/><path d="M9.5 7 7.3 10.8l1.6-.6 1.1 1.2 1.2-1.4z" fill="#fff"/></symbol>
    </defs>
  </svg>

  <section id="screen-home" class="screen">
    <button id="home-settings" class="icon-btn corner-btn" aria-label="Settings"><svg class="ic"><use href="#ic-gear"/></svg></button>
    <div class="home-art" aria-hidden="true"></div>
    <div class="home-top">
      <div class="logo">WORM</div>
      <div class="tagline">Get Your Wiggle On</div>
    </div>
    <div class="home-bottom">
      <button id="btn-play" class="big-btn play-btn"><span class="btn-main">Play</span><span id="play-sub" class="btn-sub"></span></button>
      <div class="home-links">
        <button id="btn-levels" class="soft-btn">All Levels</button>
        <button id="btn-wardrobe" class="soft-btn"><svg class="ic ic-sm"><use href="#ic-hat"/></svg>Wardrobe</button>
      </div>
      <div id="home-progress" class="home-foot"></div>
    </div>
  </section>

  <section id="screen-levels" class="screen">
    <header class="topbar">
      <button id="levels-back" class="icon-btn" aria-label="Back"><svg class="ic"><use href="#ic-chevron"/></svg></button>
      <div id="total-stars" class="stars-pill"></div>
    </header>
    <div class="world-pager">
      <button id="world-prev" class="world-arrow" aria-label="Previous world"><svg class="ic ic-sm"><use href="#ic-chevron"/></svg></button>
      <div class="world-head">
        <div class="world-title-row"><svg id="world-icon" class="world-icon"><use href="#ic-w-garden"/></svg><div id="world-title" class="world-title">Garden Path</div></div>
        <div id="world-stars" class="world-sub"></div>
      </div>
      <button id="world-next" class="world-arrow ic-flip" aria-label="Next world"><svg class="ic ic-sm"><use href="#ic-chevron"/></svg></button>
    </div>
    <div id="world-dots" class="world-dots" aria-hidden="true"></div>
    <div id="level-path"></div>
  </section>

  <section id="screen-game" class="screen">
    <header class="topbar">
      <button id="game-pause" class="icon-btn" aria-label="Pause (Esc)"><svg class="ic"><use href="#ic-pause"/></svg></button>
      <div class="hud-title"><div id="hud-level" class="hud-level">Level 1</div><div id="hud-name" class="hud-name"></div></div>
      <button id="game-undo" class="icon-btn" aria-label="Undo move (Z)" disabled><svg class="ic"><use href="#ic-undo"/></svg></button>
    </header>
    <div id="shared-chip" class="shared-chip" hidden>Shared puzzle · your progress here isn't saved</div>
    <div class="hud-stats">
      <div id="hud-moves" class="pill stat"><span class="stat-label">Moves</span><span id="hud-moves-n" class="stat-num">0</span><span id="hud-pace" class="pace" aria-label="Star pace"></span><span id="hud-pace-n" class="pace-n"></span></div>
      <div class="pill stat"><svg class="ic ic-apple"><use href="#ic-apple"/></svg><span id="hud-apples" class="stat-num">0</span></div>
      <div class="pill stat"><span class="stat-label">Score</span><span id="hud-score" class="stat-num">0</span></div>
    </div>
    <div id="board-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div id="modal-tutorial" class="modal hidden">
    <div class="card tutorial-card">
      <div class="card-kicker" id="tut-kicker">New Mechanics!</div>
      <div class="card-title" id="tut-title">Bridges</div>
      <div class="card-body" id="tut-body"></div>
      <button id="tut-ok" class="big-btn">Got it!</button>
    </div>
  </div>

  <div id="modal-story" class="modal hidden">
    <div class="card story-card">
      <div class="flower-topper" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>
      <canvas id="story-canvas" aria-label="Wally and Pip in Bramble Garden"></canvas>
      <div id="story-title" class="card-title">Wally's Story</div>
      <div id="story-body" class="story-body"></div>
      <div id="story-dots" class="story-dots"></div>
      <button id="story-next" class="big-btn">Continue</button>
      <button id="story-skip" class="story-skip">Skip story</button>
    </div>
  </div>

  <div id="modal-complete" class="modal hidden">
    <div class="card end-card">
      <div id="end-badge" class="badge" hidden>New best!</div>
      <canvas id="end-canvas"></canvas>
      <div id="end-title" class="end-nom">NOM!</div>
      <div id="end-stars" class="end-stars"></div>
      <div class="end-stats">
        <div class="end-stat hero"><div class="end-stat-label">Moves</div><div id="end-moves" class="end-stat-num">0</div></div>
      </div>
      <div id="end-best" class="end-sub">Best: 0</div>
      <div id="end-hint" class="end-hint"></div>
      <div id="end-unlock" class="end-unlock" hidden></div>
      <button id="btn-next" class="big-btn">Next Level</button>
      <button id="btn-replay" class="ghost-btn">Replay</button>
    </div>
  </div>

  <div id="modal-fail" class="modal hidden">
    <div class="card end-card">
      <canvas id="fail-canvas" aria-hidden="true"></canvas>
      <div aria-live="assertive" role="alert" aria-atomic="true">
        <div id="fail-title" class="end-nom">Stuck!</div>
        <div id="fail-sub" class="end-sub"></div>
      </div>
      <button id="btn-fail-primary" class="big-btn">Undo last move</button>
      <div class="btn-row">
        <button id="btn-retry" class="ghost-btn">Try again</button>
        <button id="btn-fail-levels" class="ghost-btn">Levels</button>
      </div>
    </div>
  </div>

  <div id="modal-pause" class="modal hidden">
    <div class="card pause-card">
      <canvas id="pause-canvas" aria-hidden="true"></canvas>
      <div class="card-title pause-title">Wally's napping</div>
      <div id="pause-sub" class="pause-sub"></div>
      <button id="btn-resume" class="big-btn">Resume</button>
      <div class="btn-row">
        <button id="btn-restart" class="ghost-btn"><svg class="ic ic-sm"><use href="#ic-restart"/></svg>Restart</button>
        <button id="btn-pause-levels" class="ghost-btn">Levels</button>
      </div>
      <div id="pause-toggles" class="toggle-chips"></div>
    </div>
  </div>

  <div id="modal-settings" class="modal hidden">
    <div class="card settings-card">
      <div class="card-title">Settings</div>
      <div id="settings-list" class="settings-list"></div>
      <div id="settings-story-wrap" hidden>
        <div class="settings-subhead">Wally &amp; Pip's story</div>
        <div id="settings-story" class="settings-story"></div>
      </div>
      <button id="settings-done" class="big-btn">Done</button>
    </div>
  </div>

  <div id="modal-wardrobe" class="modal hidden">
    <div class="card wardrobe-card">
      <canvas id="wardrobe-preview" aria-hidden="true"></canvas>
      <div id="wardrobe-name" class="card-title">Classic Wally</div>
      <div id="wardrobe-note" class="wardrobe-note"></div>
      <div id="wardrobe-grid" class="wardrobe-grid" role="listbox" aria-label="Hats"></div>
      <button id="wardrobe-done" class="big-btn">Done</button>
    </div>
  </div>

  <!-- level-to-level "iris" wipe that closes on Wally and reopens on him -->
  <div id="iris" aria-hidden="true"></div>
</div>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="story.js"></script>
<script src="app.js"></script>
</body>
</html>
